<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6778; --line: #e2e5eb;
  --accent: #3b6cf6; --accent-text: #ffffff; --bar: #3b6cf6; --bar-off: #eef0f4;
  --open: #5f6778; --doing: #c77700; --done: #2f9e5b; --bad: #c42f2f; --bad-bg: #fde8e8;
  --code: #eef0f4; --hover: #f1f3f7; --effort: #4b1d8f; --effort-text: #ffffff;
}
:root[data-theme="dark"] {
  --bg: #12151c; --panel: #1b1f29; --text: #e6e9f0; --muted: #98a0b3; --line: #2b3040;
  --accent: #6d93ff; --accent-text: #0e1220; --bar: #6d93ff; --bar-off: #252a37;
  --open: #98a0b3; --doing: #f0a63a; --done: #4cc47f; --bad: #ff7b7b; --bad-bg: #3a2024;
  --code: #252a37; --hover: #252a37; --effort: #7b3fe4; --effort-text: #ffffff;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
       display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 20px;
         background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-size: 16px; font-weight: 600; }
button, .btn, input[type=text], input[type=search], select { font: inherit; font-size: 14px; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover, .btn:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
#fileStatus { display: inline-flex; align-items: center; gap: 6px; }
#fileStatus.bad { color: var(--bad); }
#fileStatus button { padding: 1px 8px; font-size: 13px; }
button:disabled:hover { border-color: var(--line); }
input[type=text], input[type=search] { cursor: text; }
.ghost { background: none; border-color: transparent; color: var(--muted); }
.ghost:hover { color: var(--text); border-color: transparent; background: var(--hover); }
.pill { font-size: 13px; padding: 2px 10px; border-radius: 12px; color: var(--accent); border-color: var(--accent); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--code); border-radius: 8px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 4px 12px; font-size: 13px; }
.seg button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(20, 25, 40, .15); }
.spacer { flex: 1; }
.hint { color: var(--muted); font-size: 13px; }
.pop { position: relative; display: inline-flex; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; min-width: 240px; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 8px 24px rgba(20, 25, 40, .14); }
.mi { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; padding: 7px 10px; border: 0;
  border-radius: 6px; background: none; text-align: left; font-size: 14px; color: var(--text); cursor: pointer; }
.mi:hover, .mi:focus-visible { background: var(--hover); }
.mi:disabled { background: none; }
.mi .k { color: var(--muted); font-size: 12px; }
.mi input[type=text] { width: 7.5em; font-size: 13px; padding: 3px 7px; }
.sep { height: 1px; background: var(--line); margin: 5px 4px; }
.panel { padding: 14px; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
main { flex: 1; min-height: 0; display: flex; }
.pane { flex: 1; min-width: 0; overflow: auto; }
#editorPane { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
#editorPane.solo { border-right: 0; }
textarea { flex: 1; width: 100%; resize: none; border: 0; outline: 0; padding: 16px; background: var(--panel);
  color: var(--text); font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 4; }
#viewPane { padding: 0; }
.toolbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 0 20px; padding: 0 24px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 2px; color: var(--muted); }
.tab:hover { border-color: transparent; border-bottom-color: var(--line); color: var(--text); }
.tab.on, .tab.on:hover { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; }
.search { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--panel); color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { border: 0; padding: 5px 0; width: 12em; outline: 0; background: none; }
.badge { font-size: 12px; line-height: 1.5; color: var(--accent-text); background: var(--accent); border-radius: 9px; padding: 0 6px; }
.badge:empty { display: none; }
.pctl { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; }
.pctl > button, .pctl > .pop > button { border: 0; border-radius: 0; background: none; }
.pctl > button { color: var(--muted); padding: 5px 9px; }
.pctl > button:hover { color: var(--text); background: var(--hover); }
.pctl .pmid { font-weight: 600; padding: 5px 12px; }
.pctl.on .pmid { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.pctl .caret { color: var(--muted); font-weight: normal; }
.content { padding: 14px 24px 80px; }
.context { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.context:empty { display: none; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 10px;
  max-width: calc(100% - 32px); background: var(--text); color: var(--panel); padding: 8px 10px 8px 16px; border-radius: 10px;
  font-size: 14px; box-shadow: 0 8px 24px rgba(20, 25, 40, .25); }
.toast.bad { background: var(--bad); color: #ffffff; }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; padding: 2px 8px; }
.toast button:hover { background: rgba(255, 255, 255, .15); }
.hidden { display: none !important; }
.drop { outline: 3px dashed var(--accent); outline-offset: -8px; }

/* planner views: plain lists, details in right-hand columns (Who, Size, Date), colour only where it means something */
#viewPane { background: var(--panel); }
.content > div { max-width: 1080px; margin: 0 auto; }
.when { color: var(--muted); font-weight: normal; font-size: 13px; }
.count { color: var(--muted); font-weight: normal; font-size: 13px; }
.sechead, .task, .colhead { display: grid; grid-template-columns: minmax(0, 1fr) 96px 44px 232px; align-items: center; column-gap: 8px; }
.sechead { margin: 26px 0 0; padding: 0 10px 4px; border-bottom: 1px solid var(--line); }
.sechead:first-child { margin-top: 8px; }
.sechead h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sechead h2 .when { font-size: 12px; letter-spacing: 0; text-transform: none; margin-left: 8px; }
.sechead .c { font-size: 11px; }
h3.ph { display: flex; align-items: baseline; gap: 10px; margin: 0; padding: 18px 10px 4px; font-size: 16px; font-weight: 600; }
h3.ph .at { color: var(--muted); font-weight: normal; }
.task { min-height: 34px; padding: 0 10px; border-radius: 6px; font-size: 15px; }
.task:hover, .task:focus-within { background: var(--hover); }
.lead { display: flex; align-items: center; min-width: 0; }
.ttl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g { align-self: stretch; flex: none; width: 22px; margin-left: 12px; border-left: 1px solid var(--line); }
.task .c, .sechead .c { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task .c.date { display: inline-flex; justify-content: flex-end; align-items: center; gap: 5px; }
.task .c.late { color: var(--bad); font-weight: 600; }
.proj { color: var(--muted); font-size: 13px; margin-right: 8px; flex: none; }
button.st { flex: none; width: 26px; height: 26px; padding: 0; margin-right: 6px; border: 1px solid transparent; border-radius: 13px;
  background: none; display: inline-flex; align-items: center; justify-content: center; }
button.st:hover { border-color: var(--line); background: var(--panel); }
button.st:disabled { opacity: .5; cursor: wait; }
.s-open .st { color: var(--muted); } .s-doing .st { color: var(--doing); } .s-done .st { color: var(--done); }
.s-done .ttl { color: var(--muted); text-decoration: line-through; }
.acts { visibility: hidden; flex: none; margin-left: auto; padding-left: 12px; display: inline-flex; gap: 2px; }
.task:hover .acts, .task:focus-within .acts { visibility: visible; }
@media (hover: none) { .acts { visibility: visible; } }
.acts button { border: 0; background: none; padding: 2px 7px; font-size: 13px; color: var(--muted); }
.acts button:hover { color: var(--text); background: var(--panel); }
.ask { font-size: 13px; padding: 2px 8px; width: 16em; }
.eff { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; background: var(--effort); color: var(--effort-text); }
.dim .lead > :not(.acts):not(.g), .dim .c { opacity: .5; }
.note { display: flex; color: var(--muted); font-size: 13px; padding: 0 10px 6px; }
.note .pad { flex: none; width: 32px; }
.empty { color: var(--muted); padding: 12px 10px; }
.err { color: var(--bad); background: var(--bad-bg); padding: 12px 16px; border-radius: 8px; }
h4.grp { margin: 24px 0 2px; padding: 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tlwrap { overflow-x: auto; }
table.tl { border-collapse: collapse; width: 100%; }
table.tl th, table.tl td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.tl th { font-size: 11px; font-weight: 600; color: var(--muted); }
table.tl th.m { text-align: center; width: 3.2%; }
table.tl td.name { position: sticky; left: 0; background: var(--panel); max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
table.tl td.name .lead { display: inline-flex; vertical-align: middle; }
table.tl td.c { padding: 5px 1px; } table.tl td.c i { display: block; height: 8px; border-radius: 1px; background: var(--bar-off); }
table.tl td.c i.on { background: var(--bar); }
table.tl td.c i.edge { border-radius: 4px; }
table.tl td.w { font-size: 13px; color: var(--muted); }
table.tl td.w.late { color: var(--bad); font-weight: 600; }

/* keyboard focus */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search input:focus-visible, textarea:focus-visible { outline: none; }

/* first run */
.welcome { max-width: 520px; margin: 48px auto; text-align: center; color: var(--muted); }
.welcome h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
.welcome p { margin: 0 0 16px; }

/* narrow windows: panes and the toolbar stack, task details wrap under the title */
@media (max-width: 720px) {
  header { padding: 8px 16px; }
  main { flex-direction: column; }
  #editorPane { border-right: 0; border-bottom: 1px solid var(--line); }
  #editorPane:not(.solo) { flex: 0 0 40%; }
  .toolbar { padding: 0 16px; }
  .tools { margin-left: 0; }
  .search input { width: 8em; }
  .content { padding: 12px 16px 80px; }
  .sechead { grid-template-columns: minmax(0, 1fr); }
  .sechead .c { display: none; }
  .task { grid-template-columns: auto auto minmax(0, 1fr); row-gap: 0; padding: 4px 10px; }
  .task .lead { grid-column: 1 / -1; }
  .task > .c { text-align: left; padding-left: 32px; font-size: 12px; }
  .task > .c:empty { display: none; }
  .task > .c + .c { padding-left: 0; }
  .task .c.date { justify-content: flex-start; }
}

/* markdown view */
.md { max-width: 760px; }
.md h1, .md h2, .md h3 { line-height: 1.25; margin: 1.2em 0 .4em; }
.md code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.md pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow: auto; }
.md pre code { padding: 0; background: none; }
.md blockquote { margin: .6em 0; padding: 0 14px; border-left: 3px solid var(--line); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md a { color: var(--accent); }
.md ul, .md ol { padding-left: 1.5em; } .md ul.tasks { list-style: none; padding-left: .3em; }
.md table { border-collapse: collapse; } .md th, .md td { border: 1px solid var(--line); padding: 4px 10px; }
</style>
</head>
<body>
<header>
  <span class="brand">Planner</span>
  <span id="fileName" class="hint"></span>
  <button id="save" class="pill hidden" title="Save (Ctrl/⌘-S)">• Unsaved · Save</button>
  <span id="fileStatus" class="hint"></span>
  <span class="spacer"></span>
  <span class="seg" id="modes">
    <button data-mode="plain">Text</button>
    <button data-mode="planner">Planner</button>
    <button data-mode="markdown">Markdown</button>
  </span>
  <span class="pop">
    <button id="more" class="ghost" aria-label="More" aria-haspopup="menu" aria-expanded="false" title="Open, save, theme and more">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
    </button>
    <div id="moreMenu" class="menu hidden" role="menu">
      <label class="mi" id="openWrap" role="menuitem" tabindex="0">Open file… <span class="k">or drop a file</span><input id="file" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden></label>
      <button class="mi" id="saveItem" role="menuitem">Save <span class="k">Ctrl/⌘-S</span></button>
      <div class="sep"></div>
      <label class="mi" id="splitWrap">Edit alongside <input type="checkbox" id="split"></label>
      <button class="mi" id="theme" role="menuitem">Dark mode <span class="k" id="themeNote"></span></button>
      <div class="sep"></div>
      <label class="mi" id="todayWrap" title="See the views as of another day, like --today">Today <input type="text" id="today" placeholder="Oct12"></label>
    </div>
  </span>
</header>
<main>
  <section class="pane" id="editorPane">
    <textarea id="editor" spellcheck="false" placeholder="Paste your notes here, or open a .txt / .md file. Drag and drop works too."></textarea>
  </section>
  <section class="pane hidden" id="viewPane"></section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const state = { mode: store.get("mode", "plain"), tab: store.get("tab", "projects"), data: null, fileName: "notes.txt", seq: 0, msg: null };

/* ---------- small DOM helper (text is always set as text, never as HTML) ---------- */
function h(tag, cls, ...kids) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  for (const k of kids) if (k != null && k !== false) n.append(k);
  return n;
}
const span = (cls, text) => h("span", cls, text);

/* ---------- pop-up menus: one open at a time; a click outside or Esc closes them ---------- */
const pops = [];
function popup(btn, menu) {
  const set = open => { menu.classList.toggle("hidden", !open); btn.setAttribute("aria-expanded", String(open)); };
  btn.addEventListener("click", e => { e.stopPropagation(); const open = menu.classList.contains("hidden"); closePops(); set(open); });
  pops.push(set);
}
function closePops() { for (const set of pops) set(false); }
document.addEventListener("click", e => { if (!e.target.closest(".menu")) closePops(); });
popup($("more"), $("moreMenu"));

/* ---------- theme (follows the system until it is chosen in the menu) ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").firstChild.textContent = t === "dark" ? "Light mode " : "Dark mode ";
  $("themeNote").textContent = store.get("theme", null) ? "" : "follows system";
}
applyTheme(store.get("theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme").onclick = () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  store.set("theme", t); applyTheme(t); closePops();
};

/* ---------- editor, files ---------- */
const editor = $("editor");
editor.value = store.get("text", "");
editor.addEventListener("input", () => { store.set("text", editor.value); state.msg = null; showFile(); schedule(); });
editor.addEventListener("keydown", e => {            // Tab indents (the format is tab-based)
  if (e.key !== "Tab" || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  const { selectionStart: a, selectionEnd: b, value: v } = editor;
  if (a === b || !v.slice(a, b).includes("\n")) {
    editor.setRangeText("\t", a, b, "end");
  } else {                                           // multi-line: indent / outdent every line
    const start = v.lastIndexOf("\n", a - 1) + 1;
    const block = v.slice(start, b).split("\n").map(l => e.shiftKey ? l.replace(/^(\t| {1,4})/, "") : "\t" + l).join("\n");
    editor.setRangeText(block, start, b, "select");
  }
  editor.dispatchEvent(new Event("input"));
});

function loadText(text, name) {
  editor.value = text; store.set("text", text);
  if (name) state.fileName = name;
  schedule();
}
$("openWrap").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
$("file").onchange = async e => {
  closePops();
  const f = e.target.files[0];
  if (f) loadText(await f.text(), f.name);
  e.target.value = "";
};
function download() {
  const a = h("a"); a.href = URL.createObjectURL(new Blob([editor.value], { type: "text/plain;charset=utf-8" }));
  a.download = state.fileName; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- file mode (python planner.py --serve notes.txt): Save writes to that file ---------- */
const nl = s => s.replace(/\r\n?/g, "\n");                 // what a text box does to line endings
const unsaved = () => state.file && editor.value !== state.file.saved;

function showFile(problem) {                                // header: file name, then "Saved" or the Save pill
  const st = $("fileStatus");
  st.classList.toggle("bad", !!problem);
  $("fileName").textContent = state.file ? state.file.name : "";
  $("save").classList.toggle("hidden", !unsaved() || !!problem);
  if (!state.file) return st.replaceChildren();
  if (problem) return st.replaceChildren(...problem);
  st.replaceChildren(unsaved() ? "" : "Saved");
}

function setFile(text, version) {                           // the page now matches the file on disk
  state.file.saved = nl(text); state.file.version = version;
  store.set("fileVersion", version || "");
  if (editor.value !== state.file.saved) { replaceText(state.file.saved); schedule(); }
  showFile();
}

async function fileApi(body) {
  const r = await fetch("/api/file", body ? { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) } : {});
  return [r, await r.json()];
}

async function startFileMode() {
  let r, d;
  try { [r, d] = await fileApi(); } catch (e) { return; }  // page opened without the server
  if (!r.ok || !d.name) return;
  state.file = { name: d.name, version: d.version, saved: nl(d.text) };
  state.fileName = d.name;
  $("openWrap").classList.add("hidden");
  // Keep unsaved edits from last time only if they were made on this exact version of this file.
  const keep = store.get("fileName", "") === d.name && store.get("fileVersion", "") === (d.version || "")
    && store.get("text", "") !== state.file.saved;
  store.set("fileName", d.name);
  if (keep) { showFile(); return; }
  editor.value = state.file.saved; store.set("text", editor.value);
  setFile(d.text, d.version);
  render(false);
}

async function save(force) {
  if (!state.file) return download();
  const text = editor.value;
  showFile(["Saving…"]);
  try {
    const [r, d] = await fileApi({ text, version: state.file.version, force: !!force });
    if (r.status === 409 && d.conflict) return conflict();
    if (!r.ok) throw new Error(d.error || r.statusText);
    state.file.saved = text; state.file.version = d.version;
    store.set("fileVersion", d.version);
    showFile();
  } catch (e) {
    showFile(["Not saved: " + e.message]);
  }
}

function conflict() {                                       // the file changed on disk under us
  const b = (label, fn) => { const x = h("button", "", label); x.onclick = fn; return x; };
  showFile([state.file.name + " changed on disk.",
    b("Load disk version", async () => {
      if (unsaved() && !confirm("Replace your unsaved changes with the version on disk?")) return;
      const [, d] = await fileApi(); setFile(d.text, d.version);
    }),
    b("Keep mine and overwrite", () => save(true))]);
}

window.addEventListener("focus", async () => {              // pick up edits made in another editor
  if (!state.file) return;
  let d;
  try { [, d] = await fileApi(); } catch (e) { return; }
  if (d.version === state.file.version) return;
  if (unsaved()) conflict(); else setFile(d.text, d.version);
});
window.addEventListener("beforeunload", e => { if (unsaved()) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  if (e.key === "Escape") closePops();
});
$("save").onclick = () => save();
$("saveItem").onclick = () => { closePops(); save(); };
for (const ev of ["dragover", "dragleave", "drop"]) document.body.addEventListener(ev, async e => {

let timer;
function schedule() { clearTimeout(timer); timer = setTimeout(() => render(false), 200); }

async function render(relayout) {
  if (relayout) layout();
  const view = $("viewPane");
  if (state.mode === "plain") return;
  if (state.mode === "markdown") {
    view.replaceChildren(h("div", "md"));
    view.firstChild.innerHTML = markdown(editor.value);    // markdown() escapes all input first
    return;
  }
  const seq = ++state.seq;
  try {
    const r = await fetch("/api/parse", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: editor.value, today: $("today").value.trim() || null, period: state.period }) });
    const data = await r.json();
    if (seq !== state.seq) return;
    if (!r.ok) {
      if (state.period) { setPeriod(null); return; }        // e.g. a stored period the server rejects: fall back to all dates
      throw new Error(data.error || r.statusText);
    }
    state.data = data;
    plannerView();
  } catch (err) {
    if (seq !== state.seq) return;
    view.replaceChildren(h("div", "err", "Could not parse: " + err.message +
      ". Planner mode needs the server: run  python planner.py --serve"));
  }
}

/* ---------- planner views ---------- */
const TABS = [["projects", "Projects"], ["timeline", "Timeline"], ["people", "People"], ["upcoming", "Upcoming"]];

/* ---------- status clicks: the server rewrites only the task's status mark ---------- */
const NEXT = { open: "doing", doing: "done", done: "open" };
const STATUS_NAME = { open: "open", doing: "in progress", done: "done" };

function replaceText(text) {           // swap in the new text, keeping the cursor and scroll where they were
  const old = editor.value;
  let a = 0, b = 0;
  while (a < old.length && a < text.length && old[a] === text[a]) a++;
  while (b < old.length - a && b < text.length - a && old[old.length - 1 - b] === text[text.length - 1 - b]) b++;
  const top = editor.scrollTop;
  editor.setRangeText(text.slice(a, text.length - b), a, old.length - b, "preserve");
  editor.scrollTop = top;
  store.set("text", text);
  showFile();
}

async function editTask(t, op, value, btn, done) {
  const before = editor.value, seq = ++state.seq;
  clearTimeout(timer);
  if (btn) btn.disabled = true;
  try {
    const r = await fetch("/api/edit", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: before, line: t.line, title: t.title, op, value, today: $("today").value.trim() || null,
        period: state.period }) });
    const res = await r.json();
    if (editor.value !== before) return render(false);          // typed meanwhile: drop the edit
    if (!r.ok) throw new Error(res.error || r.statusText);
    replaceText(res.text);
    state.data = res.data;
    state.msg = { text: done, undo: { before, after: res.text } };
  } catch (err) {
    state.msg = { text: "Not changed: " + err.message, bad: true };
    if (seq === state.seq) return render(false);
  }
  if (seq === state.seq) plannerView();
}
const setStatus = (t, status, btn) => editTask(t, "status", status, btn, `Marked "${t.title}" ${STATUS_NAME[status]}.`);

/* one-line input in place of the action buttons; Enter applies, Esc or leaving cancels */
function ask(acts, placeholder, initial, apply) {
  const input = h("input", "ask");
  input.type = "text"; input.placeholder = placeholder; input.value = initial || "";
  const buttons = [...acts.childNodes];
  const close = () => { if (input.isConnected) acts.replaceChildren(...buttons); };
  input.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); const v = input.value; input.onblur = null; close(); apply(v); }
    else if (e.key === "Escape") close();
  };
  input.onblur = close;
  acts.replaceChildren(input);
  input.focus(); input.select();
}

function actions(t) {
  const acts = span("acts");
  const add = (label, tip, placeholder, initial, apply) => {
    const b = h("button", "", label); b.title = tip;
    b.onclick = () => ask(acts, placeholder, initial, apply);
    acts.append(b);
  };
  add("Date", "Set or change the date (empty clears it)", "Oct24, Oct23--26, ~Q1 (empty clears)", t.date_text, v => {
    v = v.trim();
    if (v === (t.date_text || "")) return;
    editTask(t, "date", v, null, v ? `Set "${t.title}" to ${v}.` : `Cleared the date of "${t.title}".`);
  });
  add("Size", "Set or change the effort: s, m, l or xl (empty clears it)", "s, m, l or xl (empty clears)", t.effort, v => {
    v = v.trim().toLowerCase();
    if (v === (t.effort || "")) return;
    editTask(t, "effort", v, null, v ? `Set the effort of "${t.title}" to ${v.toUpperCase()}.` : `Cleared the effort of "${t.title}".`);
  });
  add("Who", "Add initials", "KA or KA, RT", "", v => v.trim() &&
    editTask(t, "assign", v, null, `Assigned ${v.trim()} to "${t.title}".`));
  add("Subtask", "Add a subtask at the end of this task's subtasks", "new subtask (KA) Oct24", "", v => v.trim() &&
    editTask(t, "subtask", v, null, `Added "${v.trim()}" under "${t.title}".`));
  return acts;
}

function undo() {
  const u = state.msg && state.msg.undo;
  state.msg = null;
  if (u && editor.value === u.after) { replaceText(u.before); render(false); }
  else plannerView();
}

/* ---------- filters (display only: they pick from the server's data, they never parse notes) ---------- */
const FKEYS = { q: "fq", who: "fwho", proj: "fproj", done: "fdone" };
const filt = { q: store.get("fq", ""), who: store.get("fwho", ""), proj: store.get("fproj", ""), done: store.get("fdone", "1") === "1" };
const filterOn = () => !!(filt.q.trim() || filt.who || filt.proj || !filt.done);

function filtered(d) {
  if (!filterOn()) return d;
  const q = filt.q.trim().toLowerCase();
  const keep = (t, proj) => (!filt.proj || proj === filt.proj)
    && (!filt.who || (filt.who === "(unassigned)" ? !t.assignees.length : t.assignees.includes(filt.who)))
    && (!q || [t.title, ...t.notes, proj].join("\n").toLowerCase().includes(q));
  const prune = (t, proj) => {                    // keep matching tasks, and their ancestors (dimmed) for context
    const children = t.children.map(c => prune(c, proj)).filter(Boolean);
    const self = !t.dim && keep(t, proj) && (filt.done || t.status !== "done");
    return self || children.length ? { ...t, children, dim: !self } : null;
  };
  const flat = list => list.filter(t => keep(t, t.project));
  const u = d.upcoming;
  return { ...d, filtered: true,
    projects: d.projects.map(sec => ({ ...sec,
      projects: sec.projects.map(p => ({ ...p, tasks: p.tasks.map(t => prune(t, p.name)).filter(Boolean) }))
        .filter(p => p.tasks.length) })).filter(sec => sec.projects.length),
    timeline: { ...d.timeline, rows: flat(d.timeline.rows), unscheduled: flat(d.timeline.unscheduled) },
    people: d.people.filter(g => !filt.who || g.name === filt.who)
      .map(g => ({ ...g, tasks: flat(g.tasks) })).filter(g => g.tasks.length),
    upcoming: { ...u, overdue: flat(u.overdue), due: flat(u.due), reminders: flat(u.reminders), doing: flat(u.doing) } };
}

function options(sel, names, current, all) {     // a chosen name stays listed even if it has no tasks right now
  const list = [...new Set([...names, ...(current ? [current] : [])])];
  const key = list.join("\n");
  if (sel.dataset.opts !== key) {
    sel.replaceChildren(h("option", "", all), ...list.map(n => h("option", "", n)));
    sel.firstChild.value = "";
    sel.dataset.opts = key;
  }
  sel.value = current;
}

function showToast() {                           // the last edit's message, with Undo while it still applies
  const m = state.msg;
  toast.classList.toggle("hidden", !m);
  if (!m) return toast.replaceChildren();
  toast.classList.toggle("bad", !!m.bad);
  const close = h("button", "", "×"); close.setAttribute("aria-label", "Dismiss");
  close.onclick = () => { state.msg = null; showToast(); };
  const undoBtn = m.undo && h("button", "", "Undo");
  if (undoBtn) undoBtn.onclick = undo;
  toast.replaceChildren(span("", m.text), undoBtn, close);
}

function plannerView() {
  const view = $("viewPane"), d = filtered(state.data);
  options(fWho, state.data.people.map(g => g.name), filt.who, "Everyone");
  options(fProj, state.data.projects.flatMap(sec => sec.projects.map(p => p.name)), filt.proj, "All projects");
  const n = [filt.who, filt.proj, !filt.done].filter(Boolean).length;
  fCount.textContent = n ? String(n) : "";
  fBtn.title = n ? `${n} filter${n > 1 ? "s" : ""} on` : "Filter by person or project, or hide done tasks";
  fClear.disabled = !n;
  showPeriod(state.data.period);
  const tabs = [];
  for (const [id, label] of TABS) {
    const b = h("button", "tab" + (id === state.tab ? " on" : ""), label);
    b.onclick = () => { state.tab = id; store.set("tab", id); plannerView(); };
    tabs.push(b);
  }
  tabsBox.replaceChildren(...tabs);
  const per = d.period, bits = [];               // say only what isn't obvious: a pinned Today, a period
  if ($("today").value.trim()) bits.push("As of " + d.today_label);
  if (per) bits.push(per.label + (per.current ? (per.kind === "month" ? " (this month)" : " (this season)") : ""),
    state.tab === "upcoming" ? "Upcoming always shows the next " + d.upcoming.days + " days" : "undated tasks are hidden");
  contextLine.textContent = bits.join(" · ");
  plannerBody.replaceChildren({ projects: vProjects, timeline: vTimeline, people: vPeople, upcoming: vUpcoming }[state.tab](d));
  showToast();
  if (view.children.length !== 2 || view.firstChild !== tabsRow) view.replaceChildren(tabsRow, contentBox);
}

const BELL = "M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0";
const guides = depth => Array.from({ length: depth }, () => span("g"));

/* one task row: [guides][status][@project][title]......[actions on hover] | Who | Size | Date */
function taskNode(t, { project = false, span: useSpan = false, depth = 0, date, rem } = {}) {
  const row = h("div", "task s-" + t.status);
  row.title = "line " + t.line;                         // hover shows where the task is in the text
  row.dataset.line = t.line;
  const lead = h("div", "lead", ...guides(depth), statusBox(t));
  if (project) lead.append(span("proj", "@" + t.project));
  lead.append(span("ttl", t.title), actions(t));
  const size = h("span", "c");
  if (t.effort) { const e = span("eff", t.effort.toUpperCase()); e.title = `effort: ${pts(t.points)}`; size.append(e); }
  const when = date ?? (useSpan ? (t.span && t.span.label + (t.span.how === "parent" ? " (via parent)" : "")) : t.when);
  const dateCell = h("span", "c date" + (t.overdue ? " late" : ""));
  const rems = rem ? [rem] : t.reminders.map(r => "*" + r.spec);
  if (rems.length) {
    const bell = icon(BELL, 13); bell.setAttribute("role", "img"); bell.setAttribute("aria-label", "Reminder " + rems.join(", "));
    dateCell.append(bell); dateCell.title = "Reminder: " + rems.join(", ");
  }
  const dateText = (when || "") + (t.overdue ? (when ? " · overdue" : "overdue") : "");
  if (dateText) dateCell.append(dateText);
  if (when && !rems.length) dateCell.title = when;
  row.append(lead, h("span", "c", t.assignees.join(", ") || null), size, dateCell);
  return row;
}
const pts = n => n + (n === 1 ? " pt" : " pts");
const sumPts = tasks => tasks.reduce((n, t) => n + t.points, 0);   // simple sum of what the server sent
const tasksN = n => n + (n === 1 ? " task" : " tasks");

function noteNode(text, depth) { return h("div", "note", ...guides(depth), span("pad"), text); }
function treeNode(t, depth = 0) {
  const row = taskNode(t, { depth });
  if (t.dim) { row.classList.add("dim"); row.title += " (shown because a subtask matches the filter)"; }
  return h("div", "", row, ...t.notes.map(n => noteNode(n, depth)), ...t.children.map(c => treeNode(c, depth + 1)));
}
function colHead(title, when) {                  // a section heading that also labels the right-hand columns
  return h("div", "sechead", h("h2", "", title, when && span("when", when)),
    span("c", "Who"), span("c", "Size"), span("c", "Date"));
}

function vProjects(d) {
  const out = h("div");
  for (const sec of d.projects) {
    out.append(colHead(sec.title || "Projects", sec.when));
    for (const p of sec.projects) {
      const effort = p.points.total ? ` · ${p.points.left} of ${pts(p.points.total)} left` : "";
      out.append(h("h3", "ph", h("span", "", span("at", "@"), p.name), span("count", p.done + "/" + p.total + " done" + effort)));
      for (const n of p.notes) out.append(noteNode(n, 0));
      for (const t of p.tasks) out.append(treeNode(t));
      if (!p.tasks.length) out.append(h("div", "empty", "No tasks"));
    }
  }
  if (!out.children.length) out.append(d.filtered ? h("div", "empty", "No matching tasks.") : welcome());
  return out;
}
function welcome() {                             // first run: no notes yet
  const out = h("div", "welcome", h("h2", "", editor.value.trim() ? "No projects or tasks found" : "No notes yet"),
    h("p", "", "Write tasks in Text mode, like  - finish proposal (KA) (m) Oct24 , or open a file from the ⋯ menu."));
  if (!editor.value.trim() && !state.file) {
    const b = h("button", "", "Load the example");
    b.onclick = async () => {
      try { const r = await fetch("/api/example"); const d = await r.json(); if (r.ok && !editor.value.trim()) loadText(d.text, "example.txt"); }
      catch (e) {}
    };
    out.append(b);
  }

}

function vTimeline(d) {
  const tl = d.timeline, out = h("div");
  if (!tl.rows.length) out.append(h("div", "empty", d.filtered ? "Nothing scheduled matches." : "Nothing scheduled."));
  else {
    const head = h("tr", "", h("th", "", "Task"));
    for (const c of tl.columns) { const th = h("th", "m", c.head); th.title = c.start + " to " + c.end; head.append(th); }
    head.append(h("th", "", "When"));
    const table = h("table", "tl", head);
    for (const t of tl.rows) {
      const label = t.title + (t.assignees.length ? " (" + t.assignees.join(", ") + ")" : "");
      const nm = h("td", "name", h("span", "lead s-" + t.status, statusBox(t), span("proj", "@" + t.project), span("ttl", label)));
      nm.title = "@" + t.project + "  " + label;
      const tr = h("tr", "", nm);
      t.bar.forEach((on, i) => {
        const prev = t.bar[i - 1], next = t.bar[i + 1];
        const cell = h("i", on ? "on" : "");
        if (on && (!prev || !next)) cell.classList.add("edge");
        tr.append(h("td", "c", cell));
      });
      tr.append(h("td", "w" + (t.overdue ? " late" : ""), t.span.label + (t.span.how === "parent" ? " (via parent)" : "") + (t.overdue ? " · overdue" : "")));
      table.append(tr);
    }
    out.append(h("div", "tlwrap", table));
  }
  if (tl.unscheduled.length) {
    out.append(h("h4", "grp", "Unscheduled"));
    for (const t of tl.unscheduled) out.append(taskNode(t, { project: true }));
  }
  return out;
}

function vPeople(d) {
  const out = h("div");
  for (const g of d.people) {
    const effort = sumPts(g.tasks);                // the tasks shown, so it follows the filters
    if (!out.children.length) out.append(colHead("People"));
    out.append(h("h3", "ph", g.name, span("count", tasksN(g.tasks.length) + (effort ? ", " + pts(effort) : ""))));
    for (const t of g.tasks) out.append(taskNode(t, { project: true, span: true }));
  }
  if (!d.people.length) out.append(h("div", "empty", d.filtered ? "No matching tasks." : "No open tasks."));
  return out;
}

function vUpcoming(d) {
  const u = d.upcoming, out = h("div", "", colHead(`Next ${u.days} days`, "to " + u.horizon));
  const group = (title, items, row) => {          // empty groups are left out
    if (!items.length) return;
    out.append(h("h4", "grp", title));
    for (const t of items) out.append(row(t));
  };
  group("Overdue", u.overdue, t => taskNode(t, { project: true, span: true }));
  group("Due soon", u.due, t => taskNode(t, { project: true, span: true }));
  group("Reminders", u.reminders, t => taskNode(t, { project: true, date: t.date, rem: "*" + t.spec }));
  group("In progress", u.doing, t => taskNode(t, { project: true, span: true }));
  if (out.children.length === 1) out.append(h("div", "empty", d.filtered ? "Nothing matches in the next " + u.days + " days."
    : "Nothing due, overdue or in progress in the next " + u.days + " days."));
  return out;
}

/* ---------- markdown (small, safe: everything is escaped before any tag is added) ---------- */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function inline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => "\u0000" + (codes.push("<code>" + c + "</code>") - 1) + "\u0000");
  s = s.replace(/!?\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\*\*(.+?)\*\*|__(.+?)__/g, (_, a, b) => "<strong>" + (a || b) + "</strong>")
       .replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?!\w)|(^|[^\w_])_([^_\s][^_]*?)_(?!\w)/g,
                (m, p1, a, p2, b) => (p1 ?? p2) + "<em>" + (a || b) + "</em>")
       .replace(/~~(.+?)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => codes[+i]);
}
function markdown(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n"), out = [];
  let i = 0;
  const isBlock = l => /^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s|(-{3,}|\*{3,})\s*$|\|)/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
    } else if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) {
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++;
    } else if (/^(-{3,}|\*{3,})\s*$/.test(l)) { out.push("<hr>"); i++; }
    else if (/^>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + markdown(buf.join("\n")) + "</blockquote>");
    } else if (/^\|/.test(l) && /^\|?\s*:?-+/.test(lines[i + 1] || "")) {
      const row = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let t = "<table><tr>" + row(l).map(c => "<th>" + inline(c) + "</th>").join("") + "</tr>"; i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) t += "<tr>" + row(lines[i++]).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>";
      out.push(t + "</table>");
    } else if (/^\s*([-*+]|\d+\.)\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s/.test(lines[i])) items.push(lines[i++]);
      out.push(list(items));
    } else {
      const buf = [];
      while (i < lines.length && lines[i].trim() && !(buf.length && isBlock(lines[i]))) buf.push(lines[i++]);
      out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
    }
  }
  return out.join("\n");
}
function list(items) {                                  // nested by indent (tab = 4 spaces)
  const parse = l => { const m = /^(\s*)([-*+]|\d+\.)\s+(.*)$/.exec(l.replace(/\t/g, "    ")); return { d: m[1].length, ord: /\d/.test(m[2]), text: m[3] }; };
  const rows = items.map(parse);
  let pos = 0;
  function build(depth) {
    const ord = rows[pos].ord;
    const tasks = rows[pos] && /^\[[ xX]\]\s/.test(rows[pos].text);
    let html = `<${ord ? "ol" : "ul"}${tasks ? ' class="tasks"' : ""}>`;
    while (pos < rows.length && rows[pos].d >= depth) {
      if (rows[pos].d > depth) { html = html.replace(/<\/li>$/, "") + build(rows[pos].d) + "</li>"; continue; }
      let text = rows[pos++].text, box = "";
      const c = /^\[([ xX])\]\s+(.*)$/.exec(text);
      if (c) { box = `<input type="checkbox" disabled${c[1] === " " ? "" : " checked"}> `; text = c[2]; }
      html += "<li>" + box + inline(text) + "</li>";
    }
    return html + `</${ord ? "ol" : "ul"}>`;
  }
  return build(rows[0].d);
}

/* ---------- start ---------- */
if (!["plain", "planner", "markdown"].includes(state.mode)) state.mode = "plain";
render(true);
startFileMode();
